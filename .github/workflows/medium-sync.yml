name: Medium sync

# Adds new Medium articles to src/data/articles.json; the push to main
# makes Vercel redeploy the portfolio.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medium-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: sync
        run: npm run sync:medium

      # Don't push an article that would break the deploy
      - if: steps.sync.outputs.added != '0'
        run: npm run build

      - if: steps.sync.outputs.added != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/articles.json src/assets/images
          git commit -m "Add new Medium article to articles section"
          git push
